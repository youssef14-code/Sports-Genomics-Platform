services:
  # ── 1. قاعدة بيانات MySQL 8.0 ──────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: sports-genomics-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal-net

  # ── 2. خادم الويب والـ AI (Flask + Gunicorn) ─────────────────────────────
  web:
    build: .
    container_name: sports-genomics-web
    restart: always
    ports:
      - "127.0.0.1:1904:4500"
    environment:
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_HOST=db
      - DB_NAME=${DB_NAME}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - ./logs:/app/logs
      - ./templates:/app/templates:ro # تعديل الـ UI ينعكس فوراً بدون Rebuild
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal-net

networks:
  internal-net:
    driver: bridge

volumes:
  mysqldata:
    driver: local